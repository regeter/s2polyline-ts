name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16.x'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build
      run: npm run build
      env:
        NODE_ENV: production

    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        force_orphan: true

    - name: Check if version has changed
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: check
      run: |
        PKG_VERSION=$(node -p "require('./package.json').version")
        NPM_VERSION=$(npm view s2polyline-ts version 2>/dev/null || echo "0.0.0")
        echo "Package version: $PKG_VERSION, NPM version: $NPM_VERSION"
        if [ "$PKG_VERSION" != "$NPM_VERSION" ]; then
          echo "Version has changed. Setting should_publish=true"
          echo "should_publish=true" >> $GITHUB_OUTPUT
        fi

    - name: Publish to NPM
      if: steps.check.outputs.should_publish == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
